<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="profile">
      <div class="profile-header">
        <img src="icon/profile.png" alt="Profile Picture" class="profile-pic">
        <h1>LeeSeolYu</h1>
      </div>
      <div class="social-icons">
        <a href="https://www.instagram.com/seolyu_" target="_blank">
          <img src="icon/instagram.png" alt="Instagram">
        </a>
        <a href="https://www.youtube.com/@seolyulibrary" target="_blank">
          <img src="icon/youtube.png" alt="YouTube">
        </a>
        <a href="https://github.com/leeseolyu" target="_blank">
          <img src="icon/github.png" alt="GitHub">
        </a>
        <a href="https://www.tiktok.com/@leeseolyu" target="_blank">
          <img src="icon/tiktok.png" alt="TikTok">
        </a>
        <a href="https://www.threads.net/@seolyu_" target="_blank">
          <img src="icon/threads.png" alt="Threads">
        </a>
        <a href="https://www.x.com/@leeseolyu_" target="_blank">
          <img src="icon/x.jpg" alt="X">
        </a>
        <a href="https://leeseolyu.tistory.com" target="_blank" class="dev-blog">
          <img src="icon/tistory.svg" alt="Developer Blog">
        </a>
        <a href="https://seolyu.tistory.com" target="_blank" class="life-blog">
          <img src="icon/tistory.svg" alt="Life Blog">
        </a>
        <a href="https://m.blog.naver.com/seolyu-blog" target="_blank">
          <img src="icon/naverblog.png" alt="Naver Blog">
        </a>
        <a href="https://www.linkedin.com/in/seolyu" target="_blank">
          <img src="icon/linkedin.webp" alt="LinkedIn">
        </a>
        <a href="https://www.facebook.com/profile.php?id=100080007375976&mibextid=eHce3h" target="_blank">
          <img src="icon/facebook.png" alt="Facebook">
        </a>
        <a href="https://bj.afreecatv.com/leeseolyu" target="_blank">
          <img src="icon/afreecatv.webp" alt="AfreecaTV">
        </a>
        <a href="https://brunch.co.kr/@147103623f53429" target="_blank">
          <img src="icon/brunch.svg" alt="Brunch">
        </a>
        <a href="https://chzzk.naver.com/3cd1de9087ccf7032d13e808fa3c86d7" target="_blank">
          <img src="icon/chzzk.png" alt="Chzzk">
        </a>
        <a href="#" id="hellotalk-link">
          <img src="icon/hellotalk.png" alt="HelloTalk">
        </a>
      </div>
    </div>
  </div>

  <div id="qr-modal" style="display:none;">
    <div>
      <img src="image/hellotalk-qr.jpg" alt="HelloTalk QR Code">
    </div>
  </div>

  <script>
    document.getElementById('hellotalk-link').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('qr-modal').style.display = 'flex';
    });

    function closeQRCode() {
      document.getElementById('qr-modal').style.display = 'none';
    }

    document.getElementById('qr-modal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeQRCode();
      }
    });
  </script>
</body>

</html>
